---

# Claude Code manages its own data under ~/.local/share/claude; recorded here
# for convention / reference. The native installer owns install + self-update.
claude_code_data_dir: "{{xdg_data_home}}/claude"

# Claude Code's own fixed config location -- not XDG-based, so defined here
# rather than derived from dotfiles_config_dir.
claude_config_dir: "{{'~/.claude' | expanduser}}"
