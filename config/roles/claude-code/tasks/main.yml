---

# Anthropic's native installer: user-space, no Node, cross-platform (macOS +
# Linux), self-updating. Installs the `claude` binary into ~/.local/bin
# (= xdg_bin_home, already on PATH via shellrc). npm install was deprecated in
# Jan 2026 in favor of this. `creates:` makes it install-once; the tool
# self-updates thereafter.
- name: Install Claude Code (native installer)
  shell:
    cmd: curl -fsSL https://claude.ai/install.sh | bash
    creates: "{{xdg_bin_home}}/claude"

- name: Create Claude Code config directory
  file:
    dest: "{{claude_config_dir}}"
    state: directory
    mode: 0700

# CLAUDE.md and skills/ are shared across coding harnesses (see
# docs/plans/cross-harness-ai-tooling.md) and live in config/files/agent-craft/,
# the same source the pi-agent role links.
- name: Link shared AI-tooling config files
  file:
    src: "{{dotfiles_src_dir}}/agent-craft/{{item.src}}"
    dest: "{{claude_config_dir}}/{{item.dest}}"
    state: link
    follow: no
    force: yes
  loop:
  - {src: AGENTS.md, dest: CLAUDE.md}
  - {src: skills, dest: skills}
