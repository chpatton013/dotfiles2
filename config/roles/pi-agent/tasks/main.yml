---

- name: Create Pi Agent directories
  file:
    dest: "{{item}}"
    state: directory
    mode: 0700
  with_items:
    - "{{pi_config_dir}}"
    - "{{pi_node_dir}}"
    - "{{'~/.pi/agent' | expanduser}}"

# Install the agent itself (the config below only sets up its settings). Pi is
# an npm package (Node >= 22.19); install it as a global into the shared npm
# prefix (npm_data_dir/bin, already on PATH via the npm role) — the same
# mechanism as the other npm CLIs, uniform across macOS and Linux. The official
# pi.dev installer is just an interactive wrapper around this same npm install.
- name: Install the Pi Agent CLI (npm global)
  npm:
    name: "@earendil-works/pi-coding-agent"
    global: yes
  environment:
    NPM_PREFIX: "{{npm_data_dir}}"

- name: Render Pi Agent Vars template file
  template:
    src: vars.sh
    dest: "{{shellrc_config_dir}}/0-pi-agent.sh"
    mode: 0400

# AGENTS.md, commands/, and skills/ are shared across coding harnesses (see
# docs/plans/cross-harness-ai-tooling.md) and live in config/files/agent-craft/,
# not here — the claude-code role links the same source. PER_RUN.md / PER_TURN.md
# are read by the pi-per extension and re-injected at the end of context (per
# user request / every turn) to steer a low-param model toward loading those
# skills at the right time; these stay Pi-specific since pi-per is Pi-only.
# agents/ (pi-subagents custom agent types) also stays Pi-specific: its
# frontmatter vocabulary (tools/model/isolation fields) is incompatible with
# Claude Code's own subagent format, the same reason agent-craft/agents/ is
# claude-code-only rather than shared.
- name: Link shared AI-tooling config files (XDG)
  file:
    src: "{{dotfiles_src_dir}}/agent-craft/{{item}}"
    dest: "{{pi_config_dir}}/{{item}}"
    state: link
    follow: no
    force: yes
  with_items:
  - AGENTS.md
  - commands
  - skills

- name: Link shared AI-tooling config files (~/.pi/agent/)
  file:
    src: "{{dotfiles_src_dir}}/agent-craft/{{item}}"
    dest: "{{'~/.pi/agent' | expanduser}}/{{item}}"
    state: link
    follow: no
    force: yes
  with_items:
  - AGENTS.md
  - commands
  - skills

- name: Link Pi-specific config files (XDG)
  file:
    src: "{{dotfiles_src_dir}}/pi-agent/{{item}}"
    dest: "{{pi_config_dir}}/{{item}}"
    state: link
    follow: no
    force: yes
  with_items:
  - agents
  - models.json
  - PER_RUN.md
  - PER_TURN.md
  - settings.json

- name: Link Pi-specific config files (~/.pi/agent/)
  file:
    src: "{{dotfiles_src_dir}}/pi-agent/{{item}}"
    dest: "{{'~/.pi/agent' | expanduser}}/{{item}}"
    state: link
    follow: no
    force: yes
  with_items:
  - agents
  - models.json
  - PER_RUN.md
  - PER_TURN.md
  - settings.json

- name: Link Pi Node Shell RC file
  file:
    src: "{{dotfiles_src_dir}}/pi-agent/{{item}}"
    dest: "{{shellrc_config_dir}}/{{item}}"
    state: link
    follow: no
    force: yes
  with_items:
  - 3-pi-agent.sh
