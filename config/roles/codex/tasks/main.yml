---

- name: Install Codex (standalone installer)
  shell:
    cmd: curl -fsSL https://chatgpt.com/codex/install.sh | sh
    creates: "{{xdg_bin_home}}/codex"

- name: Create Codex config directory
  file:
    dest: "{{codex_config_dir}}"
    state: directory
    mode: 0700

- name: Link shared AI-tooling config files
  file:
    src: "{{dotfiles_src_dir}}/agent-craft/{{item}}"
    dest: "{{codex_config_dir}}/{{item}}"
    state: link
    follow: no
    force: yes
  loop:
  - AGENTS.md
  - skills
